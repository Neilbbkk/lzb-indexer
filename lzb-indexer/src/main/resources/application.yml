server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/lzb_indexer?sslmode=disable
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: ${DB_PASSWORD:postgres}
  security:
    user:
      name: ${ACTUATOR_USERNAME:admin}
      password: ${ACTUATOR_PASSWORD:admin123}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        jdbc:
          batch_size: 500
          order_inserts: true
  flyway:
    enabled: true
    baseline-on-migrate: true

app:
  scanner:
    enabled: true
    fixed-rate-ms: 5000

  chains:
    - name: sepolia
      protocol: ERC20
      rpc-url: "https://sepolia.infura.io/v3/${INFURA_API_KEY:}"
      contract-address: "0x8f15B4F7F145f3F0B17C231746377F76f5771Be8"
      wallet-address: "0x3642287697C85eEB038C04aA00Da55b059B00593"
      start-block: 6900000
      page-size: 2000
      reorg-depth: 12

    - name: ethereum-uniswap
      protocol: UNISWAP_V2
      rpc-url: "https://eth.drpc.org"
      contract-address: "0xB4e16d0168e52d35CaCD2c6185b44281Ec28C9Dc"
      wallet-address: "0x0000000000000000000000000000000000000000"
      start-block: 20800000
      page-size: 2000
      reorg-depth: 12

    - name: arbitrum-gmx-vault
      protocol: GMX_VAULT
      rpc-url: "https://arb1.arbitrum.io/rpc"
      contract-address: "0xC8ee91A54287DB53897056e12D9819156D3822Fb"
      wallet-address: "0x0000000000000000000000000000000000000000"
      start-block: 450000000
      page-size: 2000
      reorg-depth: 12

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
